databases:
  - name: vibe-portfolio-db
    databaseName: vibe_portfolio
    user: vibe_portfolio
    plan: free

services:
  - type: web
    name: vibe-portfolio
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn vibe_portfolio.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vibe-portfolio-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"

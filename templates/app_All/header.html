<!-- templates/header.html -->
{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/base.css' %}">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>
                    <a href="{% url 'app_AboutMe:index' %}">{% trans 'About Me' noop%}</a>
                </li>
                <li>
                    <a href="{% url 'app_Education:education' %}">{% trans 'Education' noop%}</a>
                </li>
                <li>
                    <a href="{% url 'app_Work:work_experience' %}">{% trans 'Work' noop%}</a>
                </li>
                <li>
                    <a href="{% url 'app_Blog:blog_post_list' %}">{% trans 'Blog' noop%} </a>
                </li>
                <li>
                    <a href="{% url 'app_Skills:skills' %}">{% trans 'Skills' noop%} </a>
                </li>
            </ul>
           <form method="post" action="{% url 'set_language' %}">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ redirect_to }}">
    <div class="language-selector">
        <button type="submit" name="language" value="en">
            <img src="{% static 'images/flags/en.png' %}" alt="English" width="30" height="20">
        </button>
        <button type="submit" name="language" value="nl">
            <img src="{% static 'images/flags/nl.png' %}" alt="Dutch" width="30" height="20">
        </button>
    </div>
</form>

        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
